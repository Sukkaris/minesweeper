<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 地雷のシルエット。全テーマ共通のアイコン（テーマによって変えない） -->
  <!-- 背景：未開放マスと同じ立体ベベル（左上が明るく、右下が暗い） -->
  <rect x="0" y="0" width="512" height="512" fill="#c0c0c0"/>
  <path d="M0 0H512L468 44H44V468L0 512Z" fill="#ffffff"/>
  <path d="M512 0V512H0L44 468H468V44Z" fill="#808080"/>

  <!-- 8 方向のトゲ -->
  <g stroke="#000000" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M256 78V434"/>
    <path d="M78 256H434"/>
    <path d="M130 130L382 382"/>
    <path d="M382 130L130 382"/>
  </g>

  <!-- 本体 -->
  <circle cx="256" cy="256" r="126" fill="#000000"/>

  <!-- ハイライト -->
  <rect x="196" y="196" width="52" height="52" fill="#ffffff"/>
</svg>
