<!DOCTYPE html>
<html lang="ja" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <!-- ピンチズーム無効化・セーフエリアまで描画 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/themes.css">
</head>
<body>

  <!--
    共通 SVG 定義（旗・地雷・誤旗の×）。
    形状はここに1組だけ持ち、各マスからは <use> で参照する。
    <use> で複製された中身には外側の CSS セレクタが届かないため、
    色は各パーツの style 属性に CSS 変数（--color-flag 等）で書く。
    変数の値はテーマ側（themes.css）で差し替えられる。
  -->
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-flag" viewBox="0 0 24 24">
      <path d="M12 3h2v15h-2z" style="fill: var(--color-flag-pole)"/>
      <path d="M6 20h12v-2h-4v-1h-4v1H6z" style="fill: var(--color-flag-pole)"/>
      <path d="M14 3 4 8l10 5z" style="fill: var(--color-flag)"/>
    </symbol>
    <symbol id="icon-mine" viewBox="0 0 24 24">
      <path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"
            style="fill: none; stroke: var(--color-mine); stroke-width: 2; stroke-linecap: round"/>
      <circle cx="12" cy="12" r="6.5" style="fill: var(--color-mine)"/>
      <rect x="8.5" y="8.5" width="3" height="3" style="fill: var(--color-mine-shine)"/>
    </symbol>
    <symbol id="icon-wrong" viewBox="0 0 24 24">
      <path d="M4 4l16 16M20 4 4 20"
            style="fill: none; stroke: var(--color-wrong); stroke-width: 3; stroke-linecap: round"/>
    </symbol>
  </svg>

  <div class="app">

    <!-- ヘッダー：残り地雷数・スマイリー・タイマーを中央、歯車は右端に絶対配置 -->
    <header class="header">
      <div class="header-center">
        <div class="led" id="mine-counter" aria-label="残り地雷数">010</div>

        <button class="smiley" id="smiley" type="button" data-face="normal" aria-label="新しいゲーム">
          <!-- 顔・目・口を別パーツで持ち、data-face で目と口だけを切り替える -->
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle class="face-outline" cx="16" cy="16" r="14"/>

            <g class="eyes eyes-normal">
              <circle cx="11" cy="13" r="1.9"/>
              <circle cx="21" cy="13" r="1.9"/>
            </g>
            <g class="eyes eyes-win">
              <path d="M4.5 10.5h23v2h-1.5l-1.5 4.5h-6l-1.5-4.5h-2l-1.5 4.5h-6L6 12.5H4.5z"/>
            </g>
            <g class="eyes eyes-lost">
              <path d="M8.8 10.8l4.4 4.4M13.2 10.8l-4.4 4.4M18.8 10.8l4.4 4.4M23.2 10.8l-4.4 4.4"/>
            </g>

            <path class="mouth mouth-normal" d="M10.5 20q5.5 5.5 11 0"/>
            <circle class="mouth mouth-pressed" cx="16" cy="21.5" r="2.4"/>
            <path class="mouth mouth-win" d="M10 19.5q6 6.5 12 0"/>
            <path class="mouth mouth-lost" d="M10.5 24.5q5.5-6 11 0"/>
          </svg>
        </button>

        <div class="led" id="timer" aria-label="経過秒数">000</div>
      </div>

      <button class="gear" id="settings-button" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g class="gear-teeth">
            <rect x="10.5" y="1" width="3" height="22" rx="1"/>
            <rect x="10.5" y="1" width="3" height="22" rx="1" transform="rotate(45 12 12)"/>
            <rect x="10.5" y="1" width="3" height="22" rx="1" transform="rotate(90 12 12)"/>
            <rect x="10.5" y="1" width="3" height="22" rx="1" transform="rotate(135 12 12)"/>
          </g>
          <circle class="gear-ring" cx="12" cy="12" r="7"/>
          <circle class="gear-hole" cx="12" cy="12" r="2.8"/>
        </svg>
      </button>
    </header>

    <!-- 盤面：縦方向にはみ出す場合のみこの領域内でスクロールする -->
    <main class="main" id="main">
      <div class="board-wrap" id="board-wrap">
        <div class="board" id="board" role="grid"></div>
      </div>
    </main>

    <!-- フッター：第1段階では難易度切替を暫定配置 -->
    <footer class="footer">
      <div class="difficulty-bar" id="difficulty-bar">
        <button class="diff-btn" type="button" data-difficulty="beginner">初級</button>
        <button class="diff-btn" type="button" data-difficulty="intermediate">中級</button>
        <button class="diff-btn" type="button" data-difficulty="expert">上級</button>
      </div>
    </footer>

  </div>

  <script type="module" src="./js/ui.js"></script>
</body>
</html>
