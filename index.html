<!DOCTYPE html>
<html lang="ja" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <!-- ピンチズーム無効化・セーフエリアまで描画 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minesweeper">
  <meta name="theme-color" content="#c0c0c0">
  <title>Minesweeper</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/themes.css">
</head>
<body>

  <!--
    共通 SVG 定義（旗・地雷・誤旗の×）。
    形状はここに1組だけ持ち、各マスからは <use> で参照する。
    <use> で複製された中身には外側の CSS セレクタが届かないため、
    色は各パーツの style 属性に CSS 変数（--color-flag 等）で書く。
    変数の値はテーマ側（themes.css）で差し替えられる。
  -->
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-flag" viewBox="0 0 24 24">
      <path d="M12 3h2v15h-2z" style="fill: var(--color-flag-pole)"/>
      <path d="M6 20h12v-2h-4v-1h-4v1H6z" style="fill: var(--color-flag-pole)"/>
      <path d="M14 3 4 8l10 5z" style="fill: var(--color-flag)"/>
    </symbol>
    <symbol id="icon-mine" viewBox="0 0 24 24">
      <path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"
            style="fill: none; stroke: var(--color-mine); stroke-width: 2; stroke-linecap: round"/>
      <circle cx="12" cy="12" r="6.5" style="fill: var(--color-mine)"/>
      <rect x="8.5" y="8.5" width="3" height="3" style="fill: var(--color-mine-shine)"/>
    </symbol>
    <symbol id="icon-wrong" viewBox="0 0 24 24">
      <path d="M4 4l16 16M20 4 4 20"
            style="fill: none; stroke: var(--color-wrong); stroke-width: 3; stroke-linecap: round"/>
    </symbol>
  </svg>

  <div class="app" id="app">

    <!-- 更新検知バナー：新しい Service Worker が待機中のときだけ表示する（pwa.js が制御） -->
    <button class="update-banner" id="update-banner" type="button" hidden>
      <span class="update-banner-text">新しいバージョンがあります</span>
      <span class="update-banner-action">再読み込み</span>
    </button>

    <!-- ヘッダー：残り地雷数・スマイリー・タイマーを中央、歯車は右端に絶対配置 -->
    <header class="header">
      <div class="header-center">
        <div class="led" id="mine-counter" aria-label="残り地雷数">010</div>

        <button class="smiley" id="smiley" type="button" data-face="normal" aria-label="新しいゲーム">
          <!-- 顔・目・口を別パーツで持ち、data-face で目と口だけを切り替える -->
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle class="face-outline" cx="16" cy="16" r="14"/>

            <g class="eyes eyes-normal">
              <circle cx="11" cy="13" r="1.9"/>
              <circle cx="21" cy="13" r="1.9"/>
            </g>
            <g class="eyes eyes-win">
              <path d="M4.5 10.5h23v2h-1.5l-1.5 4.5h-6l-1.5-4.5h-2l-1.5 4.5h-6L6 12.5H4.5z"/>
            </g>
            <g class="eyes eyes-lost">
              <path d="M8.8 10.8l4.4 4.4M13.2 10.8l-4.4 4.4M18.8 10.8l4.4 4.4M23.2 10.8l-4.4 4.4"/>
            </g>

            <path class="mouth mouth-normal" d="M10.5 20q5.5 5.5 11 0"/>
            <circle class="mouth mouth-pressed" cx="16" cy="21.5" r="2.4"/>
            <path class="mouth mouth-win" d="M10 19.5q6 6.5 12 0"/>
            <path class="mouth mouth-lost" d="M10.5 24.5q5.5-6 11 0"/>
          </svg>
        </button>

        <div class="led" id="timer" aria-label="経過秒数">000</div>
      </div>

      <button class="gear" id="settings-button" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g class="gear-teeth">
            <rect x="10.5" y="1" width="3" height="22" rx="1"/>
            <rect x="10.5" y="1" width="3" height="22" rx="1" transform="rotate(45 12 12)"/>
            <rect x="10.5" y="1" width="3" height="22" rx="1" transform="rotate(90 12 12)"/>
            <rect x="10.5" y="1" width="3" height="22" rx="1" transform="rotate(135 12 12)"/>
          </g>
          <circle class="gear-ring" cx="12" cy="12" r="7"/>
          <circle class="gear-hole" cx="12" cy="12" r="2.8"/>
        </svg>
      </button>
    </header>

    <!-- 盤面：縦方向にはみ出す場合のみこの領域内でスクロールする -->
    <main class="main" id="main">
      <!-- 盤面の上端に貼り付く通知（高さ 0 の sticky）。スクロールしても盤面領域の上に出続ける -->
      <div class="notice-anchor" aria-live="polite">
        <div class="notice notice-loading" id="board-loading" hidden>盤面を生成中…</div>
        <div class="notice notice-toast" id="toast" role="status"></div>
      </div>
      <div class="board-wrap" id="board-wrap">
        <div class="board" id="board" role="grid"></div>
      </div>
    </main>

    <!-- 盤面とフッターの間の余白と区切り線（誤爆防止） -->
    <div class="footer-gap"></div>

    <!-- フッター：開放モード / フラグモードの切替ボタン1つだけ。背景色は data-mode で変わる -->
    <footer class="footer" id="footer" data-mode="reveal">
      <button class="mode-toggle" id="mode-toggle" type="button">
        <span class="mode-label" id="mode-label" aria-live="polite">開放モード</span>
        <span class="mode-hint" id="mode-hint">タップ = 開放 ／ 長押し = 旗</span>
      </button>
    </footer>

  </div>

  <!--
    設定画面：下からせり上がるフルスクリーンのシート（settings.js が制御）。
    項目の順序は仕様どおり：難易度 → テーマ → 無推測 → 長押し → 視覚演出 → サウンド → 統計 → SW 版
  -->
  <section class="sheet" id="settings" role="dialog" aria-label="設定" aria-hidden="true">
    <header class="sheet-header">
      <h2 class="sheet-title">設定</h2>
      <button class="sheet-close" id="settings-close" type="button" aria-label="閉じる">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5 5l14 14M19 5 5 19" style="fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round"/>
        </svg>
      </button>
    </header>

    <div class="sheet-body">

      <!-- 1. 難易度：選ぶと即座に新しい盤面になり、設定画面は閉じる（確認なし） -->
      <section class="settings-section">
        <h3 class="settings-heading">難易度</h3>
        <div class="choice-group" id="difficulty-group"></div>

        <!-- カスタムを選んだときだけ展開する入力欄 -->
        <div class="custom-panel" id="custom-panel" hidden>
          <div class="custom-fields">
            <label class="custom-field">
              <span class="custom-field-label">列数</span>
              <input class="number-input" id="custom-cols" type="number" inputmode="numeric" pattern="[0-9]*">
            </label>
            <label class="custom-field">
              <span class="custom-field-label">行数</span>
              <input class="number-input" id="custom-rows" type="number" inputmode="numeric" pattern="[0-9]*">
            </label>
            <label class="custom-field">
              <span class="custom-field-label">地雷数</span>
              <input class="number-input" id="custom-mines" type="number" inputmode="numeric" pattern="[0-9]*">
            </label>
          </div>
          <p class="custom-density">
            地雷密度 <strong id="custom-density">12.3%</strong>
            <span class="custom-density-hint">（20% 前後が快適です）</span>
          </p>
          <!-- 高密度（solver.js の閾値超）のときだけ表示。無推測は既定で無効だが、明示的にオンへ戻せる -->
          <div class="custom-high-density" id="custom-high-density" hidden>
            <p class="settings-note custom-high-density-note">密度が高いため無推測モードは既定で無効です</p>
            <label class="toggle-row">
              <span class="toggle-text">
                <span class="toggle-label">それでも無推測モードを使う</span>
                <span class="toggle-note">試行を 100 回に抑え、見つからなければ通常の盤面で始めます</span>
              </span>
              <input class="toggle" id="toggle-custom-no-guess" type="checkbox">
            </label>
          </div>
          <button class="btn btn-primary" id="custom-start" type="button">この設定で始める</button>
        </div>
      </section>

      <!-- 2. テーマ（選択肢は settings.js の配列から生成） -->
      <section class="settings-section">
        <h3 class="settings-heading">テーマ</h3>
        <div class="choice-group" id="theme-group"></div>
      </section>

      <!-- 3. 無推測モード（既定オン。次のゲームの初手から効く） -->
      <section class="settings-section">
        <label class="toggle-row">
          <span class="toggle-text">
            <span class="toggle-label">無推測モード</span>
            <span class="toggle-note">運に頼らず論理だけで解ける盤面を出します</span>
          </span>
          <input class="toggle" id="toggle-no-guess" type="checkbox">
        </label>
      </section>

      <!-- 4. 長押しの長さ＋試し押し -->
      <section class="settings-section">
        <div class="settings-row">
          <label class="settings-heading" for="long-press-range">長押しの長さ</label>
          <div class="settings-value" id="long-press-value">300 ms</div>
        </div>
        <input class="settings-range" id="long-press-range" type="range" min="200" max="600" step="50" value="300">
        <div class="settings-try">
          <div class="settings-note">試し押し（長押しで旗が立つ／外れる）</div>
          <!-- 3×3 の中央だけが押せる。周囲は長押し成立時に沈む範囲を見せるための飾り -->
          <div class="board dummy-board" id="dummy-board" aria-hidden="true">
            <div class="cell hidden"></div><div class="cell hidden"></div><div class="cell hidden"></div>
            <div class="cell hidden"></div><div class="cell hidden" id="dummy-cell"></div><div class="cell hidden"></div>
            <div class="cell hidden"></div><div class="cell hidden"></div><div class="cell hidden"></div>
          </div>
        </div>
      </section>

      <!-- 5. 視覚演出 / 6. サウンド（第5段階で機能を実装。ここでは保存のみ） -->
      <section class="settings-section">
        <label class="toggle-row">
          <span class="toggle-text">
            <span class="toggle-label">視覚演出</span>
            <span class="toggle-note">クリア時などの演出（準備中）</span>
          </span>
          <input class="toggle" id="toggle-effects" type="checkbox">
        </label>
        <label class="toggle-row">
          <span class="toggle-text">
            <span class="toggle-label">サウンド</span>
            <span class="toggle-note">効果音（準備中）</span>
          </span>
          <input class="toggle" id="toggle-sound" type="checkbox">
        </label>
      </section>

      <!-- 7. 統計へのリンク -->
      <section class="settings-section">
        <button class="link-row" id="stats-open" type="button">
          <span>統計</span>
          <span class="link-row-chevron" aria-hidden="true">›</span>
        </button>
      </section>

      <!-- 8. 今動いている Service Worker のバージョン（pwa.js が問い合わせて書き込む） -->
      <p class="sheet-footnote">Service Worker: <span id="sw-version">—</span></p>
    </div>
  </section>

  <!-- 統計画面：設定画面の上に重ねて開く（stats-screen.js が制御） -->
  <section class="sheet sheet-upper" id="stats" role="dialog" aria-label="統計" aria-hidden="true">
    <header class="sheet-header">
      <button class="sheet-back" id="stats-back" type="button">
        <span class="sheet-back-chevron" aria-hidden="true">‹</span>設定
      </button>
      <h2 class="sheet-title">統計</h2>
    </header>

    <div class="sheet-body">
      <table class="stats-table" id="stats-table"></table>
      <p class="settings-note">中断したゲームは敗北として数えます。カスタム難易度は記録しません。</p>
      <button class="btn btn-danger" id="stats-reset" type="button">統計をリセット</button>
    </div>
  </section>

  <script type="module" src="./js/ui.js"></script>
  <script type="module" src="./js/pwa.js"></script>
</body>
</html>
